[project]
name = "mcp-opensearch"
version = "0.1.0"
description = "Read-only MCP server for opensearch (Phase 2)."
requires-python = ">=3.12"
dependencies = [
  "mcp-common",
  "opensearch-py[async]>=2.6,<4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "mcp<2",
]

[project.scripts]
mcp-opensearch = "mcp_opensearch.cli:main"

[tool.uv.sources]
mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_opensearch"]
