[project]
name = "mcp-ingest"
version = "0.1.0"
description = "Ingest/embedding pipeline CLI for the kb schema (Phase 3, FR-012). Not an MCP server."
requires-python = ">=3.12"
dependencies = [
  "mcp-common",
  # Connectors reuse the transport layer (client.py) of the source packages (ADR-0012 A4).
  "mcp-confluence",
  "mcp-gitlab",
  "mcp-opensearch",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# ~2 GB of weights + torch; only needed when MCP_INGEST_EMBEDDING_PROVIDER=local (ADR-0010).
local-embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
mcp-ingest = "mcp_ingest.cli:main"

[tool.uv.sources]
mcp-common = { workspace = true }
mcp-confluence = { workspace = true }
mcp-gitlab = { workspace = true }
mcp-opensearch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ingest"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "mcp_ingest/migrations"
