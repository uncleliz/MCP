[project]
name = "mcp-cloudwatch"
version = "0.1.0"
description = "Read-only MCP server for cloudwatch (Phase 2)."
requires-python = ">=3.12"
dependencies = [
  "mcp-common",
  "boto3>=1.35",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "mcp<2",
]

[project.scripts]
mcp-cloudwatch = "mcp_cloudwatch.cli:main"

[tool.uv.sources]
mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_cloudwatch"]
