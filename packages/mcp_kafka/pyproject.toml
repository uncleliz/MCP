[project]
name = "mcp-kafka"
version = "0.1.0"
description = "Read-only MCP server for kafka (Phase 2)."
requires-python = ">=3.12"
dependencies = [
  "mcp-common",
  "confluent-kafka>=2.15,<3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "mcp<2",
]

[project.scripts]
mcp-kafka = "mcp_kafka.cli:main"

[tool.uv.sources]
mcp-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kafka"]
