# T-015: dev/test infra for the 4 emulatable sources (architecture.md "Hạ tầng dev/test").
# Confluence/GitLab/OpenSearch/Kibana/CloudWatch are NOT emulated here (remote real
# systems) — unit tests use respx/mock against captured fixture payloads instead.
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down -v   # -v to also drop volumes

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcp-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcp_admin
      POSTGRES_PASSWORD: mcp_admin_dev_password
      POSTGRES_DB: mcp_kb
    ports:
      - "5432:5432"
    volumes:
      - mcp_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_admin -d mcp_kb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: mcp-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--aclfile", "/etc/redis/users.acl"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/users.acl:/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "mcp_admin_dev_password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: mcp-dev-kafka
    restart: unless-stopped
    # Single-node KRaft (no Zookeeper): broker + controller in one process (ADR-0009).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # R17 / ADR-0003 A3 / ADR-0009 A1: auto-create must be off — the read-only
      # negative test itself must never be able to create a topic as a side effect.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: mcp-dev-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: ap-southeast-1
      PERSISTENCE: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mcp_dev_postgres_data:
