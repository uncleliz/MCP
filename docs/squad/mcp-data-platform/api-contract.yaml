  /mcp/redis/tools/redis_get_key:
    post:
      operationId: redis_get_key
      tags: [redis]
      summary: Đọc giá trị một key theo đúng kiểu dữ liệu của nó.
      description: |
        Đọc theo kiểu: string→`GET`, hash→`HSCAN`, list→`LRANGE`, set→`SSCAN`,
        zset→`ZRANGE WITHSCORES`, stream→`XRANGE`. Số phần tử và byte bị cắt
        (`element_limit`, `max_bytes`) → `status=partial` + `truncated=true`.
        `status=not_found` khi key không tồn tại (FR-008 AC-002 — nil tường minh).
        Giá trị đi qua redaction; key bị deny-glob trả `not_found` + cảnh báo policy.
      x-requirements: [FR-008, FR-009]
      x-acceptance-criteria: [FR-008/AC-001, FR-008/AC-002, FR-008/AC-003]
      x-phase: 2
      x-mcp-server: mcp-redis
      x-readonly: true
      x-side-effects: none
      x-guardrails: ["command allowlist", "no SET/DEL/EXPIRE", "key deny-glob", "redaction"]
      x-upstream: "TYPE + GET/HSCAN/LRANGE/SSCAN/ZRANGE/XRANGE"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [key]
              properties:
                key: { type: string, minLength: 1, maxLength: 1024 }
                db: { type: integer, minimum: 0, maximum: 15, default: 0 }
                element_limit: { type: integer, minimum: 1, maximum: 500, default: 100 }
                max_bytes: { $ref: '#/components/schemas/MaxBytesField' }
            example: { key: "session:abc123", element_limit: 50 }
      responses:
        '200': { $ref: '#/components/responses/RedisKeyValueResult' }
        default: { $ref: '#/components/responses/ToolError' }

