      x-upstream: "AdminClient.list_topics() (cluster-wide) + describe_configs + Consumer.get_watermark_offsets"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topic]
              properties:
                topic: { type: string, minLength: 1, maxLength: 249 }
