  # ===========================================================================
  # PHASE 2 — mcp-opensearch (FR-004, FR-009)
  # ===========================================================================
  /mcp/opensearch/tools/opensearch_list_indices:
    post:
      operationId: opensearch_list_indices
      tags: [opensearch]
      summary: Liệt kê index/alias khớp pattern (read-only).
      description: Dùng `_cat/indices`. Giúp Claude biết index nào tồn tại trước khi search (tránh đoán tên index).
      x-requirements: [FR-004]
      x-acceptance-criteria: [FR-004/AC-001, FR-004/AC-002]
      x-phase: 2
      x-mcp-server: mcp-opensearch
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /_cat/indices/{pattern}?format=json"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pattern: { type: string, default: "*", maxLength: 256 }
                include_system: { type: boolean, default: false, description: Bỏ qua index bắt đầu bằng dấu chấm. }
                limit: { $ref: '#/components/schemas/LimitField' }
            example: { pattern: "app-logs-*", limit: 50 }
      responses:
        '200': { $ref: '#/components/responses/OpenSearchIndexList' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/opensearch/tools/opensearch_get_mapping:
    post:
      operationId: opensearch_get_mapping
      tags: [opensearch]
      summary: Lấy mapping (tên + kiểu field) của index.
      description: |
        Cần thiết để Claude viết query đúng field. Trả dạng phẳng `field -> type` để tiết kiệm
        context. `status=not_found` khi index không tồn tại (FR-004 AC-002).
      x-requirements: [FR-004]
      x-acceptance-criteria: [FR-004/AC-001, FR-004/AC-002]
      x-phase: 2
      x-mcp-server: mcp-opensearch
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /{index}/_mapping"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [index]
              properties:
                index: { type: string, minLength: 1, maxLength: 256 }
                field_filter: { type: [string, "null"], default: null, description: Lọc theo tiền tố tên field. }
            example: { index: "app-logs-2026.09.30" }
      responses:
        '200': { $ref: '#/components/responses/OpenSearchMappingResult' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/opensearch/tools/opensearch_search_logs:
    post:
      operationId: opensearch_search_logs
      tags: [opensearch]
      summary: Tìm log/document bằng query_string + khoảng thời gian bắt buộc.
      description: |
        Tool chính cho FR-004/FR-009. `query` là cú pháp `query_string` (Lucene), được kết hợp
        với filter range trên `time_field`. Khoảng thời gian là **bắt buộc** và không vượt
        `MCP_MAX_TIME_RANGE_DAYS` (mặc định 31) để tránh quét toàn cluster.
        Phân trang bằng `search_after` được đóng gói trong `cursor` opaque.
        Citation = index + `_id` + `@timestamp`.
      x-requirements: [FR-004, FR-009]
      x-acceptance-criteria: [FR-004/AC-001, FR-004/AC-002, FR-009/AC-001]
      x-phase: 2
      x-mcp-server: mcp-opensearch
      x-readonly: true
      x-side-effects: none
      x-upstream: "POST /{index}/_search (body chỉ đọc, chặn script/runtime_mappings)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [index_pattern, query, time_from, time_to]
              properties:
                index_pattern: { type: string, minLength: 1, maxLength: 256 }
                query: { type: string, minLength: 1, maxLength: 2048, description: "Cú pháp query_string, ví dụ `level:ERROR AND service:payment`." }
                time_field: { type: string, default: "@timestamp" }
                time_from: { type: string, format: date-time }
                time_to: { type: string, format: date-time }
                fields:
                  type: array
                  items: { type: string }
                  maxItems: 30
                  default: []
                  description: Chỉ trả các field này (giảm context); rỗng = _source đã cắt bớt.
                sort_order: { type: string, enum: [asc, desc], default: desc }
                highlight: { type: boolean, default: false }
                limit: { $ref: '#/components/schemas/LimitField' }
                cursor: { $ref: '#/components/schemas/CursorField' }
                timeout_s: { $ref: '#/components/schemas/TimeoutField' }
            example:
              index_pattern: "app-logs-*"
              query: "service:payment AND level:ERROR"
              time_from: "2026-09-30T10:00:00Z"
              time_to: "2026-09-30T12:00:00Z"
              fields: ["@timestamp", "level", "service", "message", "trace_id"]
              limit: 20
      responses:
        '200': { $ref: '#/components/responses/OpenSearchDocumentList' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/opensearch/tools/opensearch_count:
    post:
      operationId: opensearch_count
      tags: [opensearch]
      summary: Đếm số document khớp query trong khoảng thời gian.
      description: Dùng để đánh giá quy mô (ví dụ "có bao nhiêu lỗi trong 2 giờ") trước khi lấy sample log.
      x-requirements: [FR-004, FR-009]
      x-acceptance-criteria: [FR-004/AC-001, FR-004/AC-002]
      x-phase: 2
      x-mcp-server: mcp-opensearch
      x-readonly: true
      x-side-effects: none
      x-upstream: "POST /{index}/_count"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [index_pattern, query, time_from, time_to]
              properties:
                index_pattern: { type: string, minLength: 1, maxLength: 256 }
                query: { type: string, minLength: 1, maxLength: 2048 }
                time_field: { type: string, default: "@timestamp" }
                time_from: { type: string, format: date-time }
                time_to: { type: string, format: date-time }
                timeout_s: { $ref: '#/components/schemas/TimeoutField' }
            example:
              index_pattern: "app-logs-*"
              query: "level:ERROR"
              time_from: "2026-09-30T10:00:00Z"
              time_to: "2026-09-30T12:00:00Z"
      responses:
        '200': { $ref: '#/components/responses/OpenSearchCountResult' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/opensearch/tools/opensearch_aggregate:
    post:
      operationId: opensearch_aggregate
      tags: [opensearch]
      summary: Aggregation có giới hạn (terms / date_histogram) trên khoảng thời gian.
      description: |
        Chỉ hỗ trợ hai dạng agg an toàn: `terms` (top-N giá trị của một field — ví dụ top
        error_code) và `date_histogram` (phân bố theo thời gian). Không nhận agg spec tuỳ ý,
        không cho phép `scripted_metric`.
      x-requirements: [FR-004, FR-009]
      x-acceptance-criteria: [FR-004/AC-001, FR-004/AC-002, FR-009/AC-001]
      x-phase: 2
      x-mcp-server: mcp-opensearch
      x-readonly: true
      x-side-effects: none
      x-upstream: "POST /{index}/_search?size=0 (aggs dựng bởi server)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [index_pattern, agg_type, field, time_from, time_to]
              properties:
                index_pattern: { type: string, minLength: 1, maxLength: 256 }
                agg_type: { type: string, enum: [terms, date_histogram] }
                field: { type: string, minLength: 1, maxLength: 256 }
                query: { type: string, default: "*", maxLength: 2048 }
                time_field: { type: string, default: "@timestamp" }
                time_from: { type: string, format: date-time }
                time_to: { type: string, format: date-time }
                interval:
                  type: [string, "null"]
                  enum: [1m, 5m, 15m, 1h, 1d, null]
                  default: null
                  description: Bắt buộc khi `agg_type=date_histogram`.
                size: { type: integer, minimum: 1, maximum: 100, default: 10, description: Chỉ dùng với `terms`. }
                timeout_s: { $ref: '#/components/schemas/TimeoutField' }
            example:
              index_pattern: "app-logs-*"
              agg_type: terms
              field: "error_code.keyword"
              query: "service:payment AND level:ERROR"
              time_from: "2026-09-30T10:00:00Z"
              time_to: "2026-09-30T12:00:00Z"
              size: 10
      responses:
        '200': { $ref: '#/components/responses/OpenSearchBucketList' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/opensearch/tools/opensearch_search_dsl:
    post:
      operationId: opensearch_search_dsl
      tags: [opensearch]
      summary: Chạy query DSL do người dùng cung cấp trên `_search` (escape hatch, TẮT mặc định).
      description: |
        Escape hatch cho truy vấn phức tạp mà `opensearch_search_logs` / `_count` / `_aggregate`
        không diễn đạt được. **Tool này TẮT mặc định** (`MCP_OPENSEARCH_ALLOW_DSL=false`) và chỉ
        được đăng ký khi người vận hành bật tường minh; khi tắt, tool không xuất hiện trong
        tool list. Lý do: nó mang phần lớn rủi ro read-only còn lại của `mcp-opensearch`.

        Guardrail (tất cả đều bắt buộc, kiểm bằng fixture payload tấn công):
        * Chỉ endpoint `_search`. **Cấm** `scroll` và `point_in_time` (chúng tạo state phía
          server → là side effect, vi phạm ADR-0003 lớp 4), `profile`, `search_template`,
          `indices_boost`.
        * Khoá cấp cao nhất theo **allowlist trong schema** (`additionalProperties: false`).
        * **Duyệt đệ quy toàn bộ body** và từ chối (`error.code=not_permitted`) nếu gặp ở
          BẤT KỲ độ sâu nào: `script`, `script_score`, `script_fields`, `scripted_metric`,
          `bucket_script`, `bucket_selector`, `_script`, `runtime_mappings`, `id`
          (stored script/template), hoặc `terms.<field>.index` (terms-lookup — đọc index khác
          `index_pattern`, thoát khỏi phạm vi index).
        * Phân trang (reconciled 2026-10-01): `body.size` ∈ 0..100 và `body.from` ∈ 0..900
          (ngoài khoảng → `invalid_argument`); `size` mặc định = `limit` và nếu `size > limit`
          thì bị **kẹp** xuống `limit` kèm `meta.warnings`; `from + size ≤ 1000` (chặn deep
          paging → `invalid_argument`, gợi ý `search_after`). `from` KHÔNG bị ép ≤ `limit`.
        * Client đặt `timeout=<timeout_s>s` trong body gửi đi (timeout phía cluster).
          `search.allow_expensive_queries` là **cluster setting** (không có tham số
          per-request) nên không phải guardrail của tool này; nếu cần, người vận hành đặt nó ở
          cluster/role — guardrail thực sự là deny-list đệ quy ở trên.
        * `aggs` được chấp nhận để giữ tương thích query DSL, nhưng **kết quả aggregation
          không được trả** (response chỉ có document hits, schema `OpenSearchDocumentList`);
          khi upstream trả `aggregations`, tool thêm `meta.warnings` hướng dẫn dùng
          `opensearch_aggregate`.
        * Bề mặt tool mặc định: khi flag tắt, `mcp-opensearch` hiển thị **5** tool (Phase 2 = 24
          tool, toàn hệ = 48 tool); bật flag → 6 / 25 / 49.
      x-requirements: [FR-004, FR-009]
      x-acceptance-criteria: [FR-004/AC-001, FR-004/AC-002, FR-014/AC-001]
      x-phase: 2
      x-mcp-server: mcp-opensearch
      x-readonly: true
      x-side-effects: none
      x-risk: escape-hatch
      x-feature-flag: "MCP_OPENSEARCH_ALLOW_DSL (default false — tool không được đăng ký)"
      x-guardrails:
        - "endpoint=_search only; scroll/PIT/profile/search_template/indices_boost bị cấm"
        - "top-level allowlist bằng additionalProperties:false"
        - "duyệt ĐỆ QUY deny: script|script_score|script_fields|scripted_metric|bucket_script|bucket_selector|_script|runtime_mappings|id|terms.*.index"
        - "size in 0..100 (clamped to limit, warning); from in 0..900; from+size <= 1000"
        - "aggs accepted but aggregation results are not returned (warning -> use opensearch_aggregate)"
      x-upstream: "POST /{index}/_search"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [index_pattern, body]
              properties:
                index_pattern: { type: string, minLength: 1, maxLength: 256 }
                body:
                  type: object
                  description: |
                    Query DSL. Chỉ các khoá cấp cao nhất dưới đây được chấp nhận
                    (`additionalProperties: false`); nội dung bên trong vẫn bị duyệt đệ quy
                    theo deny-list nêu ở `x-guardrails`.
                  additionalProperties: false
                  properties:
                    query: { type: object, additionalProperties: true }
                    sort:
                      oneOf:
                        - type: array
                          items: { type: [object, string] }
                        - type: object
                          additionalProperties: true
                    _source:
                      oneOf:
                        - type: boolean
                        - type: array
                          items: { type: string }
                        - type: object
                          additionalProperties: true
                    aggs: { type: object, additionalProperties: true }
                    highlight: { type: object, additionalProperties: true }
                    size: { type: integer, minimum: 0, maximum: 100 }
                    from: { type: integer, minimum: 0, maximum: 900 }
                    search_after: { type: array, items: { type: [string, number, boolean, "null"] } }
                    track_total_hits: { type: [boolean, integer] }
                limit: { $ref: '#/components/schemas/LimitField' }
                timeout_s: { $ref: '#/components/schemas/TimeoutField' }
            example:
              index_pattern: "app-logs-*"
              body:
                query:
                  bool:
                    must: [{ match: { service: "payment" } }]
                    filter: [{ range: { "@timestamp": { gte: "2026-09-30T10:00:00Z", lte: "2026-09-30T12:00:00Z" } } }]
                size: 20
              limit: 20
      responses:
        '200': { $ref: '#/components/responses/OpenSearchDocumentList' }
        default: { $ref: '#/components/responses/ToolError' }

