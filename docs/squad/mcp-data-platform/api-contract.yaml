          description: Biến môi trường còn thiếu → nguyên nhân `configured=false`.
    MigrationResult:
      type: object
      additionalProperties: false
      required: [applied, current_version]
      properties:
        applied: { type: array, items: { type: string } }
        already_applied: { type: array, items: { type: string }, default: [] }
        current_version: { type: [string, "null"] }
        dry_run: { type: boolean, default: false }

  # ===========================================================================
  # EXAMPLES dùng chung — nhánh empty / not_found / error
  # QA phải kiểm chứng CẢ 4 nhánh cho mọi tool (ADR-0013).
  # ===========================================================================
  examples:
    EmptyResult:
      summary: "status=empty — truy vấn hợp lệ, không có kết quả (KHÔNG phải lỗi)"
      description: |
        Nhánh này thoả mọi AC-002 dạng "trả về empty tường minh thay vì bịa nội dung"
        (FR-001/002/004/005/007/008/010/011) và là dữ liệu để Claude nói "không tìm thấy"
        (FR-015 AC-002). Lưu ý `citations` rỗng là ĐÚNG khi `status=empty`.

        **CẢNH BÁO CHO QA — example này được `$ref` bởi nhiều server khác nhau.**
        `meta.source` và `meta.query_echo` ở đây chỉ **minh hoạ hình dạng** (giá trị lấy từ
        Confluence). Mỗi server PHẢI trả `meta.source` của chính nó và `query_echo` theo tham
        số của chính nó. Harness của QA **không được** fixture `meta.source`/`query_echo` từ
        example này; chỉ dùng nó để kiểm cấu trúc (`status`, `items: []`, `citations: []`).
      value:
        status: empty
        items: []
        citations: []
        meta:
          source: confluence
          returned: 0
          has_more: false
          next_cursor: null
          truncated: false
          elapsed_ms: 188
          as_of: "2026-10-01T03:00:00Z"
          query_echo: { query: "không tồn tại abcxyz" }
          warnings: ["no match for the given query/time range"]
    NotFoundResult:
      summary: "status=not_found — định danh cụ thể không tồn tại"
      description: |
        Dùng khi người dùng chỉ đích danh một id/topic/key/queue không tồn tại. Cũng không phải
        lỗi — `not_found` là `ResultStatus`, **không** có trong `ErrorCode`.
        Cùng cảnh báo như `EmptyResult`: `meta.source`/`query_echo` chỉ là minh hoạ hình dạng.
      value:
        status: not_found
        items: []
        citations: []
        meta:
          source: confluence
          returned: 0
          has_more: false
          next_cursor: null
          truncated: false
          elapsed_ms: 121
          as_of: "2026-10-01T03:00:00Z"
          query_echo: { page_id: "000000" }
          warnings: ["identifier does not exist at source"]
    ErrorUpstreamTimeout:
      summary: "error — upstream_timeout (NFR-002: rủi ro VPN/mạng nội bộ)"
      value:
        status: error
        error:
          code: upstream_timeout
          message: "connect timeout tới wiki.example.com sau 3s"
          source: confluence
          retryable: true
          retry_after_s: null
          details:
            host: "wiki.example.com"
            hint: "kiểm tra VPN/kết nối mạng nội bộ tới wiki.example.com"
            phase: connect
            timeout_s: 3
          request_id: "01JB2Q9X7K"
    ErrorNotPermitted:
      summary: "error — not_permitted (FR-014 AC-002: guard read-only chặn)"
      description: |
        Trả về khi client gọi một operation/command nằm ngoài allowlist, hoặc khi body chứa
        cấu trúc bị cấm (ví dụ `script` trong OpenSearch DSL). Tool ghi **không tồn tại** nên
        MCP SDK trả "unknown tool"; mã này dành cho các đường gián tiếp.
      value:
        status: error
        error:
          code: not_permitted
          message: "operation không nằm trong allowlist read-only"
          source: opensearch
          retryable: false
          retry_after_s: null
          details:
            operation: "body.script"
            allowlist: ["query", "sort", "_source", "aggs", "size", "from", "search_after", "highlight"]
          request_id: "01JB2Q9X7L"
    ErrorInvalidInput:
      summary: "error — invalid_input (không gọi nguồn)"
      value:
        status: error
        error:
          code: invalid_input
          message: "time_from phải nhỏ hơn time_to"
          source: cloudwatch
          retryable: false
          retry_after_s: null
          details: { field: "time_from" }
          request_id: "01JB2Q9X7M"

