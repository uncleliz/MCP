  # ===========================================================================
  # PHASE 2 — mcp-kafka (FR-007, FR-009)
  # Read-only protocol (ADR-0009): không bao giờ khởi tạo Producer;
  # consumer dùng assign() + enable.auto.commit=false + group.id dùng-một-lần,
  # không gọi commit() ở bất kỳ nhánh nào => offset của consumer khác không đổi.
  #
  # BẮT BUỘC — chống auto-create topic (đây là một thao tác GHI thật):
  #   * `allow.auto.create.topics=false` trên CẢ Consumer VÀ AdminClient.
  #   * KHÔNG BAO GIỜ truyền `topic=` vào metadata request: gọi `list_topics()` ở mức cluster
  #     rồi filter phía client. Metadata request theo tên topic sẽ TẠO topic trên broker có
  #     `auto.create.topics.enable=true` (mặc định của nhiều bản phân phối) — nghĩa là chính
  #     test âm của FR-007 AC-002 (topic không tồn tại) sẽ mutate cluster.
  #   * ACL phía Kafka: `Describe` + `Read` trên topic pattern cần thiết, và
  #     DENY `Create` trên cả Cluster và Topic.
  # ===========================================================================
  /mcp/kafka/tools/kafka_list_topics:
    post:
      operationId: kafka_list_topics
