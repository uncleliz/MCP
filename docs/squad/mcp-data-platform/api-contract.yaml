  /cli/mcp-ingest/prune:
    post:
      operationId: ingest_prune
      tags: [ingest]
      summary: "CLI: xoá vật lý document đã tombstone và áp giới hạn retention cho kho embedding."
      description: |
        Không có lệnh này thì `kb` chỉ tăng: document tombstone giữ nguyên chunk, chiếm chỗ ứng
        viên của HNSW (làm nặng thêm R12) và làm chậm truy vấn FR-011.
        `--tombstoned` xoá vật lý `kb.documents` có `deleted_at` cũ hơn `--older-than`
        (cascade sang `kb.chunks`); `--older-than` một mình áp retention cho document còn sống
        không được nguồn cập nhật trong khoảng đó (mặc định TẮT — phải truyền tường minh).
        Sau khi xoá lượng lớn, in ra khuyến nghị `REINDEX INDEX CONCURRENTLY` cho index HNSW
        kèm `maintenance_work_mem` cần thiết.
      x-requirements: [FR-012]
      x-acceptance-criteria: [FR-012/AC-003]
      x-phase: 3
      x-interface: cli
      x-cli-command: "mcp-ingest prune [--tombstoned] [--older-than 90d] [--source …] [--dry-run] [--json]"
      x-mcp-server: none
      x-readonly: false
      x-writes: kb
      x-side-effects: "DELETE trên kb.documents (cascade kb.chunks)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
                - required: [tombstoned]
                - required: [older_than_days]
              description: Phải truyền ít nhất `tombstoned=true` hoặc `older_than_days` — lệnh không có hành vi mặc định.
              properties:
                tombstoned: { type: boolean, default: false }
                older_than_days: { type: [integer, "null"], minimum: 1, default: null }
                source: { type: string, enum: [all, confluence, gitlab, opensearch], default: all }
                dry_run: { type: boolean, default: true, description: Mặc định TRUE — phải tắt tường minh để thực sự xoá. }
            example: { tombstoned: true, older_than_days: 30, dry_run: true }
      responses:
        '200':
          description: Kết quả prune.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [documents_deleted, chunks_deleted, dry_run]
                properties:
                  documents_deleted: { type: integer, minimum: 0 }
                  chunks_deleted: { type: integer, minimum: 0 }
                  dry_run: { type: boolean }
                  reindex_recommended: { type: boolean, default: false }
                  per_source:
                    type: array
                    default: []
                    items:
                      type: object
                      additionalProperties: false
                      required: [source_type, documents_deleted, chunks_deleted]
                      properties:
                        source_type: { $ref: '#/components/schemas/SourceType' }
                        documents_deleted: { type: integer, minimum: 0 }
                        chunks_deleted: { type: integer, minimum: 0 }
              examples:
                dry_run:
                  value:
                    documents_deleted: 84
                    chunks_deleted: 612
                    dry_run: true
                    reindex_recommended: false
                    per_source:
                      - { source_type: confluence, documents_deleted: 12, chunks_deleted: 71 }
                      - { source_type: gitlab, documents_deleted: 72, chunks_deleted: 541 }
        default: { $ref: '#/components/responses/ToolError' }

  /cli/mcp-ingest/reembed:
    post:
      operationId: ingest_reembed
      tags: [ingest]
      summary: "CLI: embed lại chunk đã lưu bằng model mới (không crawl lại nguồn)."
      description: |
        Dùng khi đổi embedding model (ADR-0010). Chạy theo lô, an toàn khi bị ngắt giữa chừng
        (chunk đã re-embed được đánh dấu bằng `embedding_model`). Nếu số chiều của model mới
        khác `vector(N)` hiện tại, lệnh **từ chối** và yêu cầu chạy migration trước.
      x-requirements: [FR-012]
      x-acceptance-criteria: [FR-012/AC-003]
      x-phase: 3
      x-interface: cli
      x-cli-command: "mcp-ingest reembed --model MODEL_ID [--source …] [--batch-size N] [--json]"
      x-mcp-server: none
      x-readonly: false
      x-writes: kb
      x-side-effects: "UPDATE kb.chunks (embedding, embedding_model, embedded_at)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [model]
              properties:
                model: { type: string, minLength: 1, maxLength: 128 }
                source: { type: string, enum: [all, confluence, gitlab, opensearch], default: all }
                batch_size: { type: integer, minimum: 1, maximum: 512, default: 64 }
            example: { model: "BAAI/bge-m3", source: all, batch_size: 64 }
      responses:
        '200':
          description: Báo cáo re-embed (cùng schema với `ingest_run`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestRunReport' }
              examples:
                ok:
                  value:
                    mode: reembed
                    started_at: "2026-10-05T02:00:00Z"
                    finished_at: "2026-10-05T02:48:10Z"
                    status: success
                    exit_code: 0
                    embedding_model: "BAAI/bge-m3"
                    sources:
                      - source_type: confluence
                        run_id: "9b1d1e10-0000-4000-8000-00000000000a"
                        status: success
                        documents_seen: 320
                        documents_upserted: 0
                        documents_skipped: 0
                        documents_failed: 0
                        chunks_written: 1841
                        duration_s: 2890.0
                        cursor_advanced: false
                        errors: []
        default: { $ref: '#/components/responses/ToolError' }

# =============================================================================
# COMPONENTS
# =============================================================================
components:

  schemas:

    # ----- Input field fragments (dùng lại ở nhiều tool) ---------------------
    LimitField:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
      description: Số item tối đa trả về. Trần cứng 100 để tránh context bloat (ADR-0015).
    CursorField:
      type: [string, "null"]
      maxLength: 4096
      default: null
      description: |
        Cursor opaque base64 lấy từ `meta.next_cursor` của lần gọi trước. Client KHÔNG được
        parse hay tự dựng. Mỗi nguồn đóng gói cơ chế riêng bên trong (offset, `search_after`,
        `nextToken`, SCAN cursor, page number).
    MaxBytesField:
      type: integer
      minimum: 1024
      maximum: 131072
      default: 65536
      description: |
        Trần byte cho nội dung tự do trong response.
        **Trần hiệu lực = `min(max_bytes, MCP_MAX_OUTPUT_BYTES)`** (mặc định 131072 = 128 KiB,
        bằng đúng `maximum` ở đây). Việc bị kẹp xuống được báo trong `meta.warnings` và
        **không bao giờ** là lỗi. Vượt trần → cắt + `meta.truncated=true` + `status=partial`.
        `error.code=response_too_large` chỉ dành cho nội dung **không thể cắt** (ví dụ một giá
        trị Redis đơn lẻ lớn hơn trần mà cắt sẽ làm sai nghĩa dữ liệu).
    TimeoutField:
      type: integer
      minimum: 1
      maximum: 22
      default: 20
      description: |
        Deadline nội bộ của tool call (giây). **Phải nhỏ hơn `MCP_TOOL_DEADLINE`** (mặc định 25)
        ít nhất 3s để tool còn kịp dựng `status=partial` trước khi deadline ngoài cắt coroutine
        — vì vậy `maximum: 22`. Bất biến của ADR-0006:
        `sum(per-attempt timeout × attempts) + backoff < timeout_s < MCP_TOOL_DEADLINE`.
        Tool cần thời gian dài hơn (Logs Insights, OpenSearch query nặng) **không** dùng
        `timeout_s > 22`; phải nâng `MCP_TOOL_DEADLINE_<TOOL>` ở cấu hình server.
        Hết `timeout_s` → `status=partial` (nếu đã có dữ liệu một phần) hoặc
        `error.code=upstream_timeout` (NFR-002).

    # ----- Enum dùng chung ---------------------------------------------------
    SourceType:
      type: string
      description: Định danh nguồn dữ liệu (9 nguồn trong scope).
      enum: [confluence, gitlab, opensearch, kibana, cloudwatch, kafka, redis, sqs, sns, pgvector]
    ResultStatus:
      type: string
      description: |
        Trạng thái của một kết quả **thành công**:
        * `ok` — có dữ liệu.
        * `empty` — truy vấn hợp lệ, không có kết quả. KHÔNG phải lỗi (mọi AC-002 dạng
          "trả empty tường minh").
        * `not_found` — định danh cụ thể được yêu cầu không tồn tại.
        * `partial` — có dữ liệu nhưng bị cắt (`meta.truncated`) hoặc một phần nguồn lỗi.
        Lỗi thật KHÔNG nằm trong enum này — xem `ErrorEnvelope`.
      enum: [ok, empty, not_found, partial]

    # ----- Citation / Meta / Envelope ---------------------------------------
    Citation:
      type: object
      additionalProperties: false
      required: [source_type, label]
      description: |
        Tham chiếu truy vết được về hệ nguồn (BR-002, BR-005, FR-015). Với nguồn có URL
        (Confluence, GitLab, Kibana) `uri` luôn có giá trị; với nguồn không có URL (Kafka,
        Redis) `uri` là `null` và `locator` chứa định danh (topic/partition/offset, key).
      properties:
        source_type: { $ref: '#/components/schemas/SourceType' }
        label:
          type: string
          minLength: 1
          maxLength: 512
          description: Nhãn người đọc được, ví dụ "Payment retry policy (PAY) v7".
        uri:
          type: [string, "null"]
          maxLength: 2048
          description: URL mở được, hoặc `null` nếu nguồn không có URL.
        locator:
          type: object
          additionalProperties: true
          default: {}
          description: |
            Định danh máy đọc được, đủ để tái tạo truy vấn. Ví dụ
            `{page_id, version}`, `{project, path, ref, line}`, `{index, doc_id, timestamp}`,
            `{log_group, log_stream, timestamp}`, `{topic, partition, offset}`, `{key, db}`,
            `{queue_arn}`, `{document_id, chunk_index, source_uri}`.
        retrieved_at: { type: [string, "null"], format: date-time, default: null }

    Meta:
      type: object
      additionalProperties: false
      required: [source, returned, has_more, truncated, elapsed_ms, as_of]
      properties:
        source: { $ref: '#/components/schemas/SourceType' }
        returned: { type: integer, minimum: 0 }
        has_more: { type: boolean }
        next_cursor:
          type: [string, "null"]
          default: null
          description: Truyền lại vào `cursor` để lấy trang tiếp. `null` khi `has_more=false`.
        truncated:
          type: boolean
          default: false
          description: Có nội dung bị cắt vì `max_bytes`/`element_limit`.
        elapsed_ms: { type: integer, minimum: 0 }
        as_of:
          type: string
          format: date-time
          description: Thời điểm server lấy dữ liệu (không phải thời điểm dữ liệu được tạo).
        query_echo:
          type: object
          additionalProperties: true
          default: {}
          description: Tham số hiệu lực đã dùng (sau khi áp default) — để Claude nói đúng phạm vi đã tra.
        warnings:
          type: array
          items: { type: string, maxLength: 512 }
          default: []
          description: |
            Ghi chú không phải lỗi: nội dung bị cắt, số key bị chặn bởi policy,
            `max_bytes` bị kẹp xuống `MCP_MAX_OUTPUT_BYTES`, `best_similarity` dưới ngưỡng,
            filter có thể đã loại mất match (xem `kb_semantic_search`), query Insights chưa
            hoàn tất, số liệu là xấp xỉ…
        redactions:
          type: integer
          minimum: 0
          default: 0
          description: |
            Số lần `mcp_common.redact.scrub()` thay thế một chuỗi nghi là secret trong response
            này (ADR-0015). `> 0` là tín hiệu cho người đọc rằng nội dung đã bị che một phần.
        data_freshness:
          type: [object, "null"]
          default: null
          additionalProperties: false
          description: Chỉ có ở `mcp-pgvector` (dữ liệu đã index nên có thể cũ) — phục vụ NFR-004.
          properties:
            last_ingested_at: { type: [string, "null"], format: date-time }
            staleness_hours: { type: [number, "null"], minimum: 0 }
            embedding_model: { type: [string, "null"] }

    ItemBase:
      type: object
      description: Phần chung của mọi item — `citation_ref` trỏ tới index trong `citations`.
      properties:
        citation_ref:
          type: integer
          minimum: 0
          description: Index (0-based) của phần tử trong `citations` tương ứng với item này.
      required: [citation_ref]

    ToolResultBase:
      type: object
      additionalProperties: false
      required: [status, items, citations, meta]
      description: |
        Envelope thống nhất cho MỌI tool (ADR-0004). Mỗi operation làm hẹp `items` bằng `allOf`.

        **Bất biến — được ENCODE trong schema bên dưới (JSON Schema 2020-12 `if/then`), không
        phải chỉ là mô tả:**
        1. `status` ∈ {`ok`, `partial`} ⇒ `citations` có ít nhất 1 phần tử (BR-002, FR-015).
        2. `status` ∈ {`empty`, `not_found`} ⇒ `items` rỗng **và** `citations` rỗng.
        3. `meta.has_more = true` ⇒ `meta.next_cursor` khác `null`.

        **Bất biến KHÔNG biểu diễn được bằng JSON Schema** — bắt buộc kiểm bằng
        `mcp_common.testing.assert_envelope_invariants()` (dùng cho cả unit test của BE và
        harness của QA):
        4. `0 <= item.citation_ref < len(citations)` với mọi item (không có ref lơ lửng).
        5. `meta.returned == len(items)`.
        6. `citation.uri != null` khi `citation.source_type` ∈ {`confluence`, `gitlab`,
           `kibana`, và mọi citation của `mcp-pgvector`} — các nguồn này luôn có URL mở được
           (FR-001/002/005 AC-001, FR-011 AC-001). Với `opensearch`, `cloudwatch`, `kafka`,
           `redis`, `sqs`, `sns` thì `uri=null` là hợp lệ và `locator` phải đủ định danh.
        7. `status=partial` với `items` rỗng là hợp lệ (ví dụ Logs Insights hết thời gian
           trước khi có hàng nào); khi đó citation bắt buộc là **citation phạm vi** —
           log group + cửa sổ thời gian, hoặc index + khoảng — chứ không phải citation của item.
      properties:
        status: { $ref: '#/components/schemas/ResultStatus' }
        items:
          type: array
          description: Bị override bởi từng operation với schema item cụ thể.
          items: { type: object }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        meta: { $ref: '#/components/schemas/Meta' }
      allOf:
        - if:
            properties: { status: { enum: [ok, partial] } }
            required: [status]
          then:
            properties: { citations: { minItems: 1 } }
        - if:
            properties: { status: { enum: [empty, not_found] } }
            required: [status]
          then:
            properties:
              items: { maxItems: 0 }
              citations: { maxItems: 0 }
        - if:
            properties:
              meta:
                properties: { has_more: { const: true } }
                required: [has_more]
            required: [meta]
          then:
            properties:
              meta:
                properties: { next_cursor: { type: string, minLength: 1 } }
                required: [next_cursor]

    # ----- Error (một schema duy nhất cho mọi operation) --------------------
    ErrorCode:
      type: string
      description: |
        Taxonomy lỗi dùng chung. `empty` và `not_found` **KHÔNG** có trong enum này — chúng là
        `ResultStatus` của một kết quả thành công. Bất biến kiểm chứng được (contract test):
        `set(ErrorCode) ∩ set(ResultStatus) == ∅`.
      enum:
        - invalid_input
        - not_permitted
        - unauthorized
        - forbidden
        - upstream_timeout
        - upstream_unavailable
        - upstream_error
        - rate_limited
        - response_too_large
        - source_misconfigured
        - internal
    ErrorSource:
      description: |
        Nguồn phát sinh lỗi. Là một `SourceType`, hoặc `ingest` cho lỗi ở tầng CLI của pipeline
        (config/migration/reconcile — không thuộc nguồn nào), hoặc `none` cho lỗi nội tại của
        server. `ingest`/`none` **không** phải `SourceType` nên không lọt vào `citations` hay
        `kb_semantic_search.source_types`.
      oneOf:
        - $ref: '#/components/schemas/SourceType'
        - type: string
          enum: [ingest, none]
    Error:
      type: object
      additionalProperties: false
      required: [code, message, source, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message:
          type: string
          maxLength: 1024
          description: Thông điệp cho người đọc. KHÔNG chứa stack trace, secret, hay SQL thô.
        source: { $ref: '#/components/schemas/ErrorSource' }
        retryable: { type: boolean }
        retry_after_s: { type: [integer, "null"], minimum: 0, default: null }
        details:
          type: object
          additionalProperties: true
          default: {}
          description: |
            Ngữ cảnh có cấu trúc: `{field}` cho `invalid_input`;
            `{host, hint}` cho `upstream_timeout`/`upstream_unavailable` (hint nhắc VPN — NFR-002);
            `{operation, allowlist}` cho `not_permitted`;
            `{missing_env}` cho `source_misconfigured`.
        request_id: { type: [string, "null"], default: null }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [status, error]
      description: |
        Payload trả trong `structuredContent` khi MCP tool result có `isError: true`.
      properties:
        status: { type: string, const: error }
        error: { $ref: '#/components/schemas/Error' }

    # ----- Fragment dùng nhiều lần -----------------------------------------
    Dimension:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: { type: string, maxLength: 255 }
        value: { type: string, maxLength: 1024 }
    GitLabProjectRef:
      type: string
      maxLength: 512
      description: |
        Project **bắt buộc** cho các tool chi tiết (`gitlab_get_file`, `gitlab_list_repository_tree`,
        `gitlab_list_commits`, `gitlab_get_merge_request`, `gitlab_get_issue`, `gitlab_list_pipelines`,
        `gitlab_get_pipeline`): `path_with_namespace` (khuyến nghị, ví dụ `team/payment-service`)
        hoặc numeric id dạng **string**. Không có default; `null` không hợp lệ (→ `invalid_argument`).
    GitLabProjectScope:
      type: [string, "null"]
      maxLength: 512
      default: null
      description: |
        Phạm vi project **tuỳ chọn** cho các tool tìm/liệt kê toàn instance (`gitlab_search_code`,
        `gitlab_list_merge_requests`, `gitlab_list_issues`): `path_with_namespace` hoặc numeric id
        dạng string; `null` (mặc định) = toàn instance trong phạm vi token.

    # =======================================================================
    # ITEM SCHEMAS — Confluence (FR-001)
    # =======================================================================
    ConfluencePage:
      type: object
      additionalProperties: false
      required: [id, title, space_key, url, citation_ref]
      properties:
        id: { type: string, description: Page id dạng string (không parse thành number). }
        title: { type: string }
        space_key: { type: string }
        url: { type: string, format: uri, description: URL dùng làm citation (FR-001 AC-001). }
        excerpt: { type: [string, "null"], description: Trích đoạn khi search; `null` khi lấy full page. }
        content:
          type: [string, "null"]
          description: |
            Nội dung đầy đủ đã chuẩn hoá (markdown/text), bọc trong
            `<untrusted-content …>` và đã redaction (ADR-0015). `null` ở kết quả search.
        version: { type: [integer, "null"], minimum: 0 }
        updated_at: { type: [string, "null"], format: date-time }
        author: { type: [string, "null"] }
        labels: { type: array, items: { type: string }, default: [] }
        citation_ref: { type: integer, minimum: 0 }
    ConfluenceSpace:
      type: object
      additionalProperties: false
      required: [key, name, url, citation_ref]
      properties:
        key: { type: string }
        name: { type: string }
        type: { type: [string, "null"], enum: [global, personal, null] }
        url: { type: string, format: uri }
        citation_ref: { type: integer, minimum: 0 }
    ConfluenceChildPage:
      type: object
      additionalProperties: false
      required: [id, title, url, citation_ref]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        updated_at: { type: [string, "null"], format: date-time }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — GitLab (FR-002)
    # =======================================================================
    GitLabProject:
      type: object
      additionalProperties: false
      required: [id, path_with_namespace, web_url, citation_ref]
      properties:
        id: { type: string, description: Numeric id dạng string. }
        path_with_namespace: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        web_url: { type: string, format: uri }
        default_branch: { type: [string, "null"] }
        visibility: { type: [string, "null"], enum: [private, internal, public, null] }
        last_activity_at: { type: [string, "null"], format: date-time }
        archived: { type: [boolean, "null"] }
        citation_ref: { type: integer, minimum: 0 }
    GitLabCodeHit:
      type: object
      additionalProperties: false
      required: [project_path, path, ref, web_url, citation_ref]
      properties:
        project_path: { type: string }
        path: { type: string }
        ref: { type: string }
        start_line: { type: [integer, "null"], minimum: 1 }
        excerpt: { type: [string, "null"], description: "Đoạn code khớp, đã redaction." }
        web_url: { type: string, format: uri, description: Link tới đúng file/dòng — citation. }
        citation_ref: { type: integer, minimum: 0 }
    GitLabFile:
      type: object
      additionalProperties: false
      required: [project_path, path, ref, content, web_url, citation_ref]
      properties:
        project_path: { type: string }
        path: { type: string }
        ref: { type: string }
        size_bytes: { type: [integer, "null"], minimum: 0 }
        content: { type: string, description: "Đã decode, chuẩn hoá, redaction và bọc untrusted-content." }
        truncated: { type: boolean, default: false }
        last_commit_id: { type: [string, "null"] }
        web_url: { type: string, format: uri }
        citation_ref: { type: integer, minimum: 0 }
    GitLabTreeEntry:
      type: object
      additionalProperties: false
      required: [path, name, type, citation_ref]
      properties:
        path: { type: string }
        name: { type: string }
        type: { type: string, enum: [tree, blob, commit] }
        mode: { type: [string, "null"] }
        web_url: { type: [string, "null"], format: uri }
        citation_ref: { type: integer, minimum: 0 }
    GitLabCommit:
      type: object
      additionalProperties: false
      required: [id, short_id, title, web_url, citation_ref]
      properties:
        id: { type: string }
        short_id: { type: string }
        title: { type: string }
        message: { type: [string, "null"] }
        author_name: { type: [string, "null"] }
        authored_date: { type: [string, "null"], format: date-time }
        committed_date: { type: [string, "null"], format: date-time }
        web_url: { type: string, format: uri }
        citation_ref: { type: integer, minimum: 0 }
    GitLabNote:
      type: object
      additionalProperties: false
      required: [id, body]
      properties:
        id: { type: string }
        author: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        system: { type: boolean, default: false, description: "Note do hệ thống sinh (đổi label, assign…)." }
        body: { type: string, description: Đã redaction + bọc untrusted-content. }
    GitLabChangedFile:
      type: object
      additionalProperties: false
      required: [new_path]
      properties:
        old_path: { type: [string, "null"] }
        new_path: { type: string }
        new_file: { type: boolean, default: false }
        deleted_file: { type: boolean, default: false }
        renamed_file: { type: boolean, default: false }
        diff_excerpt: { type: [string, "null"], description: "Diff bị cắt theo `max_bytes`, đã redaction." }
        truncated: { type: boolean, default: false }
    GitLabMergeRequest:
      type: object
      additionalProperties: false
      required: [iid, project_path, title, state, web_url, citation_ref]
      properties:
        iid: { type: string }
        project_path: { type: string }
        title: { type: string }
        state: { type: string, enum: [opened, closed, merged, locked] }
        draft: { type: boolean, default: false }
        source_branch: { type: [string, "null"] }
        target_branch: { type: [string, "null"] }
        author: { type: [string, "null"] }
        labels: { type: array, items: { type: string }, default: [] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        merged_at: { type: [string, "null"], format: date-time }
        description: { type: [string, "null"] }
        changed_files:
          type: [array, "null"]
          default: null
          description: Chỉ có khi `include_changes=true`.
          items: { $ref: '#/components/schemas/GitLabChangedFile' }
        notes:
          type: [array, "null"]
          default: null
          description: Chỉ có khi `include_notes=true`.
          items: { $ref: '#/components/schemas/GitLabNote' }
        web_url: { type: string, format: uri }
        citation_ref: { type: integer, minimum: 0 }
    GitLabIssue:
      type: object
      additionalProperties: false
      required: [iid, project_path, title, state, web_url, citation_ref]
      properties:
        iid: { type: string }
        project_path: { type: string }
        title: { type: string }
        state: { type: string, enum: [opened, closed] }
        author: { type: [string, "null"] }
        assignees: { type: array, items: { type: string }, default: [] }
        labels: { type: array, items: { type: string }, default: [] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        description: { type: [string, "null"] }
        notes:
          type: [array, "null"]
          default: null
          items: { $ref: '#/components/schemas/GitLabNote' }
        web_url: { type: string, format: uri }
        citation_ref: { type: integer, minimum: 0 }
    GitLabJob:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        stage: { type: [string, "null"] }
        status: { type: string }
        duration_s: { type: [number, "null"], minimum: 0 }
        failure_reason: { type: [string, "null"] }
        web_url: { type: [string, "null"], format: uri }
        trace_excerpt:
          type: [string, "null"]
          default: null
          description: Phần cuối trace của job fail; chỉ có khi `include_failed_job_trace=true`. Đã redaction.
        trace_truncated: { type: boolean, default: false }
    GitLabPipeline:
      type: object
      additionalProperties: false
      required: [id, project_path, ref, status, web_url, citation_ref]
      properties:
        id: { type: string }
        project_path: { type: string }
        ref: { type: string }
        sha: { type: [string, "null"] }
        status: { type: string }
        source: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        duration_s: { type: [number, "null"], minimum: 0 }
        jobs:
          type: [array, "null"]
          default: null
          description: Chỉ có ở `gitlab_get_pipeline`.
          items: { $ref: '#/components/schemas/GitLabJob' }
        web_url: { type: string, format: uri }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — OpenSearch (FR-004)
    # =======================================================================
    OpenSearchIndex:
      type: object
      additionalProperties: false
      required: [index, citation_ref]
      properties:
        index: { type: string }
        health: { type: [string, "null"], enum: [green, yellow, red, null] }
        status: { type: [string, "null"], enum: [open, close, null] }
        docs_count: { type: [integer, "null"], minimum: 0 }
        store_size: { type: [string, "null"], description: 'Dạng người đọc, ví dụ "4.2gb".' }
        creation_date: { type: [string, "null"], format: date-time }
        citation_ref: { type: integer, minimum: 0 }
    OpenSearchMapping:
      type: object
      additionalProperties: false
      required: [index, fields, citation_ref]
      properties:
        index: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: 'Map phẳng `field path -> type`, ví dụ `{"@timestamp": "date", "level": "keyword"}`.'
        field_count: { type: integer, minimum: 0 }
        citation_ref: { type: integer, minimum: 0 }
    OpenSearchDocument:
      type: object
      additionalProperties: false
      required: [index, id, source, citation_ref]
      properties:
        index: { type: string }
        id: { type: string, description: "`_id` dạng string — citation (FR-004 AC-001)." }
        score: { type: [number, "null"] }
        timestamp: { type: [string, "null"], format: date-time }
        source:
          type: object
          additionalProperties: true
          description: "`_source` (đã lọc theo `fields`, redaction, cắt theo `max_bytes`)."
        highlights:
          type: [object, "null"]
          default: null
          additionalProperties: { type: array, items: { type: string } }
        citation_ref: { type: integer, minimum: 0 }
    OpenSearchCount:
      type: object
      additionalProperties: false
      required: [index_pattern, count, citation_ref]
      properties:
        index_pattern: { type: string }
        count: { type: integer, minimum: 0 }
        time_from: { type: string, format: date-time }
        time_to: { type: string, format: date-time }
        citation_ref: { type: integer, minimum: 0 }
    OpenSearchBucket:
      type: object
      additionalProperties: false
      required: [key, doc_count, citation_ref]
      properties:
        key: { type: string, description: "Giá trị term, hoặc mốc thời gian ISO với `date_histogram`." }
        doc_count: { type: integer, minimum: 0 }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — Kibana (FR-005)
    # =======================================================================
    KibanaSavedObject:
      type: object
      additionalProperties: false
      required: [id, type, title, url, citation_ref]
      properties:
        id: { type: string }
        type: { type: string, enum: [dashboard, visualization, lens, search, index-pattern] }
        title: { type: string }
        description: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
        space: { type: [string, "null"] }
        url: { type: string, format: uri, description: Link Kibana — citation (FR-005 AC-001). }
        panel_count: { type: [integer, "null"], minimum: 0 }
        references:
          type: array
          default: []
          description: Object liên quan (visualization, index-pattern) — dùng để chọn đúng index khi truy vấn OpenSearch.
          items:
            type: object
            additionalProperties: false
            required: [id, type]
            properties:
              id: { type: string }
              type: { type: string }
              name: { type: [string, "null"] }
        citation_ref: { type: integer, minimum: 0 }
    KibanaDashboardLink:
      type: object
      additionalProperties: false
      required: [id, url, time_from, time_to, citation_ref]
      properties:
        id: { type: string }
        title: { type: [string, "null"] }
        url: { type: string, format: uri, description: Deep link có sẵn khung thời gian sự cố. }
        time_from: { type: string, format: date-time }
        time_to: { type: string, format: date-time }
        query: { type: [string, "null"] }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — CloudWatch (FR-006)
    # =======================================================================
    CloudWatchLogGroup:
      type: object
      additionalProperties: false
      required: [log_group_name, citation_ref]
      properties:
        log_group_name: { type: string }
        arn: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        retention_in_days: { type: [integer, "null"], minimum: 0 }
        stored_bytes: { type: [integer, "null"], minimum: 0 }
        citation_ref: { type: integer, minimum: 0 }
    CloudWatchLogEvent:
      type: object
      additionalProperties: false
      required: [log_group_name, timestamp, message, citation_ref]
      properties:
        log_group_name: { type: string }
        log_stream_name: { type: [string, "null"] }
        timestamp: { type: string, format: date-time }
        ingested_at: { type: [string, "null"], format: date-time }
        event_id: { type: [string, "null"] }
        message: { type: string, description: Đã redaction + bọc untrusted-content. }
        truncated: { type: boolean, default: false }
        citation_ref: { type: integer, minimum: 0 }
    CloudWatchInsightsRow:
      type: object
      additionalProperties: false
      required: [values, citation_ref]
      properties:
        values:
          type: object
          additionalProperties: { type: [string, "null"] }
          description: Map `field -> value` theo đúng các field mà query `fields`/`stats` sinh ra.
        citation_ref: { type: integer, minimum: 0 }
    CloudWatchMetricDefinition:
      type: object
      additionalProperties: false
      required: [namespace, metric_name, citation_ref]
      properties:
        namespace: { type: string }
        metric_name: { type: string }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/Dimension' }
          default: []
        citation_ref: { type: integer, minimum: 0 }
    CloudWatchDatapoint:
      type: object
      additionalProperties: false
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number }
    CloudWatchMetricSeries:
      type: object
      additionalProperties: false
      required: [namespace, metric_name, stat, period_s, datapoints, citation_ref]
      properties:
        namespace: { type: string }
        metric_name: { type: string }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/Dimension' }
          default: []
        stat: { type: string }
        period_s: { type: integer, minimum: 1 }
        unit: { type: [string, "null"] }
        datapoints:
          type: array
          items: { $ref: '#/components/schemas/CloudWatchDatapoint' }
        citation_ref: { type: integer, minimum: 0 }
    CloudWatchAlarm:
      type: object
      additionalProperties: false
      required: [alarm_name, state_value, citation_ref]
      properties:
        alarm_name: { type: string }
        arn: { type: [string, "null"] }
        state_value: { type: string, enum: [OK, ALARM, INSUFFICIENT_DATA] }
        state_reason: { type: [string, "null"] }
        state_updated_at: { type: [string, "null"], format: date-time }
        namespace: { type: [string, "null"] }
        metric_name: { type: [string, "null"] }
        dimensions:
          type: array
          items: { $ref: '#/components/schemas/Dimension' }
          default: []
        comparison_operator: { type: [string, "null"] }
        threshold: { type: [number, "null"] }
        period_s: { type: [integer, "null"], minimum: 1 }
        evaluation_periods: { type: [integer, "null"], minimum: 1 }
        actions_enabled: { type: [boolean, "null"] }
        citation_ref: { type: integer, minimum: 0 }
    CloudWatchAlarmHistoryItem:
      type: object
      additionalProperties: false
      required: [alarm_name, timestamp, history_item_type, citation_ref]
      properties:
        alarm_name: { type: string }
        timestamp: { type: string, format: date-time }
        history_item_type: { type: string, enum: [ConfigurationUpdate, StateUpdate, Action] }
        history_summary: { type: [string, "null"] }
        old_state: { type: [string, "null"] }
        new_state: { type: [string, "null"] }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — Kafka (FR-007)
    # =======================================================================
    KafkaTopic:
      type: object
      additionalProperties: false
      required: [topic, partition_count, citation_ref]
      properties:
        topic: { type: string }
        partition_count: { type: integer, minimum: 1 }
        replication_factor: { type: [integer, "null"], minimum: 1 }
        internal: { type: boolean, default: false }
        citation_ref: { type: integer, minimum: 0 }
    KafkaPartition:
      type: object
      additionalProperties: false
      required: [partition, low_watermark, high_watermark]
      properties:
        partition: { type: integer, minimum: 0 }
        leader: { type: [integer, "null"] }
        replicas: { type: array, items: { type: integer }, default: [] }
        isrs: { type: array, items: { type: integer }, default: [] }
        low_watermark: { type: string, pattern: '^[0-9]{1,19}$', description: Offset dạng string. }
        high_watermark: { type: string, pattern: '^[0-9]{1,19}$' }
        approx_message_count: { type: string, pattern: '^[0-9]{1,19}$', description: "`high - low`, là XẤP XỈ (retention/compaction)." }
    KafkaTopicDetail:
      type: object
      additionalProperties: false
      required: [topic, partitions, approx_message_count, citation_ref]
      properties:
        topic: { type: string }
        internal: { type: boolean, default: false }
        partitions:
          type: array
          items: { $ref: '#/components/schemas/KafkaPartition' }
        configs:
          type: [object, "null"]
          default: null
          additionalProperties: { type: [string, "null"] }
          description: Chỉ có khi `include_configs=true` (retention.ms, cleanup.policy…).
        approx_message_count: { type: string, pattern: '^[0-9]{1,19}$' }
        citation_ref: { type: integer, minimum: 0 }
    KafkaMessage:
      type: object
      additionalProperties: false
      required: [topic, partition, offset, value_format, citation_ref]
      properties:
        topic: { type: string }
        partition: { type: integer, minimum: 0 }
        offset: { type: string, pattern: '^[0-9]{1,19}$', description: Offset dạng string — citation (FR-007 AC-001). }
        timestamp: { type: [string, "null"], format: date-time }
        timestamp_type: { type: [string, "null"], enum: [create_time, log_append_time, not_available, null] }
        key: { type: [string, "null"] }
        value: { type: [string, "null"], description: "Đã decode theo `value_format`, redaction và bọc untrusted-content." }
        value_format: { type: string, enum: [json, utf8, base64, none] }
        headers:
          type: object
          additionalProperties: { type: [string, "null"] }
          default: {}
        size_bytes: { type: [integer, "null"], minimum: 0 }
        truncated: { type: boolean, default: false }
        citation_ref: { type: integer, minimum: 0 }
    KafkaConsumerGroup:
      type: object
      additionalProperties: false
      required: [group_id, citation_ref]
      properties:
        group_id: { type: string }
        state: { type: [string, "null"] }
        is_simple_consumer_group: { type: [boolean, "null"] }
        protocol_type: { type: [string, "null"] }
        citation_ref: { type: integer, minimum: 0 }
    KafkaGroupMember:
      type: object
      additionalProperties: false
      required: [member_id]
      properties:
        member_id: { type: string }
        client_id: { type: [string, "null"] }
        host: { type: [string, "null"] }
        assignments:
          type: array
          default: []
          items:
            type: object
            additionalProperties: false
            required: [topic, partition]
            properties:
              topic: { type: string }
              partition: { type: integer, minimum: 0 }
    KafkaGroupPartitionOffset:
      type: object
      additionalProperties: false
      required: [topic, partition, lag]
      properties:
        topic: { type: string }
        partition: { type: integer, minimum: 0 }
        committed_offset: { type: [string, "null"], pattern: '^(-1|[0-9]{1,19})$', description: "`null`/`-1` = chưa commit." }
        high_watermark: { type: string, pattern: '^[0-9]{1,19}$' }
        lag: { type: integer, minimum: 0 }
    KafkaConsumerGroupDetail:
      type: object
      additionalProperties: false
      required: [group_id, partition_offsets, total_lag, citation_ref]
      properties:
        group_id: { type: string }
        state: { type: [string, "null"] }
        members:
          type: [array, "null"]
          default: null
          items: { $ref: '#/components/schemas/KafkaGroupMember' }
        partition_offsets:
          type: array
          items: { $ref: '#/components/schemas/KafkaGroupPartitionOffset' }
        total_lag: { type: integer, minimum: 0 }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — Redis (FR-008)
    # =======================================================================
    RedisKeySummary:
      type: object
      additionalProperties: false
      required: [key, type, citation_ref]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, list, set, zset, hash, stream, unknown] }
        ttl_s: { type: [integer, "null"], description: "`null` = không có TTL (persistent)." }
        db: { type: integer, minimum: 0 }
        citation_ref: { type: integer, minimum: 0 }
    RedisKeyValue:
      type: object
      additionalProperties: false
      required: [key, type, value, citation_ref]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, list, set, zset, hash, stream] }
        ttl_s: { type: [integer, "null"] }
        db: { type: integer, minimum: 0 }
        encoding: { type: [string, "null"] }
        memory_usage_bytes: { type: [integer, "null"], minimum: 0 }
        element_count: { type: [integer, "null"], minimum: 0, description: Tổng phần tử ở nguồn (có thể lớn hơn số đã trả). }
        value:
          description: |
            Hình dạng theo `type`: string→string; list→array of string; set→array of string;
            zset→array of `{member, score}`; hash→object; stream→array of
            `{id, fields}`. Đã redaction (ADR-0015).
          oneOf:
            - type: string
            - type: array
              items: { type: [string, object] }
            - type: object
              additionalProperties: { type: string }
            - type: "null"
        truncated: { type: boolean, default: false }
        redactions: { type: integer, minimum: 0, default: 0 }
        citation_ref: { type: integer, minimum: 0 }
    RedisKeyInfo:
      type: object
      additionalProperties: false
      required: [key, exists, citation_ref]
      properties:
        key: { type: string }
        exists: { type: boolean }
        type: { type: [string, "null"], enum: [string, list, set, zset, hash, stream, null] }
        ttl_s: { type: [integer, "null"] }
        db: { type: integer, minimum: 0 }
        encoding: { type: [string, "null"] }
        memory_usage_bytes: { type: [integer, "null"], minimum: 0 }
        length: { type: [integer, "null"], minimum: 0, description: STRLEN/HLEN/LLEN/SCARD/ZCARD/XLEN tuỳ kiểu. }
        citation_ref: { type: integer, minimum: 0 }
    RedisServerInfo:
      type: object
      additionalProperties: false
      required: [sections, dbsize, citation_ref]
      properties:
        sections:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: [string, "null"] }
          description: 'Map `section -> {field: value}` từ `INFO`.'
        dbsize: { type: integer, minimum: 0 }
        acl_user: { type: [string, "null"], description: Kết quả `ACL WHOAMI` — dùng để xác nhận đang dùng user read-only. }
        readonly_confirmed:
          type: [boolean, "null"]
          description: |
            `true` nếu ACL của user hiện tại không có command ghi. `null` nếu không đọc được ACL.
            Phục vụ FR-014 AC-001 (lớp 3 của ADR-0003).
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — SQS / SNS (FR-010)
    # =======================================================================
    SqsQueue:
      type: object
      additionalProperties: false
      required: [queue_name, queue_url, citation_ref]
      properties:
        queue_name: { type: string }
        queue_url: { type: string, format: uri }
        arn: { type: [string, "null"] }
        citation_ref: { type: integer, minimum: 0 }
    SqsQueueAttributes:
      type: object
      additionalProperties: false
      required: [queue_name, queue_url, arn, approximate_number_of_messages, citation_ref]
      properties:
        queue_name: { type: string }
        queue_url: { type: string, format: uri }
        arn: { type: string, description: Citation (FR-010 AC-001). }
        approximate_number_of_messages: { type: integer, minimum: 0 }
        approximate_number_of_messages_not_visible: { type: [integer, "null"], minimum: 0 }
        approximate_number_of_messages_delayed: { type: [integer, "null"], minimum: 0 }
        visibility_timeout_s: { type: [integer, "null"], minimum: 0 }
        message_retention_period_s: { type: [integer, "null"], minimum: 0 }
        maximum_message_size_bytes: { type: [integer, "null"], minimum: 0 }
        fifo_queue: { type: [boolean, "null"] }
        redrive_policy:
          type: [object, "null"]
          default: null
          additionalProperties: true
          description: "`{deadLetterTargetArn, maxReceiveCount}` nếu có DLQ."
        created_at: { type: [string, "null"], format: date-time }
        last_modified_at: { type: [string, "null"], format: date-time }
        tags:
          type: [object, "null"]
          default: null
          additionalProperties: { type: string }
        citation_ref: { type: integer, minimum: 0 }
    SnsTopic:
      type: object
      additionalProperties: false
      required: [topic_arn, name, citation_ref]
      properties:
        topic_arn: { type: string }
        name: { type: string }
        citation_ref: { type: integer, minimum: 0 }
    SnsTopicAttributes:
      type: object
      additionalProperties: false
      required: [topic_arn, name, citation_ref]
      properties:
        topic_arn: { type: string }
        name: { type: string }
        display_name: { type: [string, "null"] }
        subscriptions_confirmed: { type: [integer, "null"], minimum: 0 }
        subscriptions_pending: { type: [integer, "null"], minimum: 0 }
        subscriptions_deleted: { type: [integer, "null"], minimum: 0 }
        fifo_topic: { type: [boolean, "null"] }
        effective_delivery_policy:
          type: [object, "null"]
          default: null
          additionalProperties: true
        citation_ref: { type: integer, minimum: 0 }
    SnsSubscription:
      type: object
      additionalProperties: false
      required: [subscription_arn, topic_arn, protocol, citation_ref]
      properties:
        subscription_arn: { type: string }
        topic_arn: { type: string }
        protocol: { type: string, description: "sqs | lambda | http(s) | email | sms …" }
        endpoint: { type: [string, "null"] }
        owner: { type: [string, "null"] }
        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # ITEM SCHEMAS — Knowledge base / pgvector (FR-011)
    # =======================================================================
    KbChunkMatch:
      type: object
      additionalProperties: false
      required: [chunk_id, document_id, similarity, content, source_type, source_uri, citation_ref]
      description: |
        Một chunk khớp. `source_type` + `source_uri` là **nguồn gốc thật** (Confluence/GitLab/…),
        không phải "pgvector" — đây là điều làm citation của FR-011 AC-001 / BR-005 resolve
        được về hệ nguồn.
      properties:
        chunk_id: { type: string }
        document_id: { type: string, format: uuid }
        chunk_index: { type: integer, minimum: 0 }
        similarity: { type: number, minimum: 0, maximum: 1, description: "`1 - cosine_distance`." }
        content: { type: string, description: "Đã cắt theo `max_chars_per_chunk`, redaction, bọc untrusted-content." }
        heading_path: { type: [string, "null"], description: Đường dẫn heading trong document — giúp citation chỉ đúng mục. }
        source_type: { $ref: '#/components/schemas/SourceType' }
        source_id: { type: string }
        source_uri: { type: string, format: uri }
        title: { type: [string, "null"] }
        container: { type: [string, "null"] }
        source_updated_at: { type: [string, "null"], format: date-time }
        ingested_at: { type: [string, "null"], format: date-time }
        embedding_model: { type: string }
        truncated: { type: boolean, default: false }
        citation_ref: { type: integer, minimum: 0 }
    KbDocument:
      type: object
      additionalProperties: false
      required: [document_id, source_type, source_uri, content, citation_ref]
      properties:
        document_id: { type: string, format: uuid }
        source_type: { $ref: '#/components/schemas/SourceType' }
        source_id: { type: string }
        source_uri: { type: string, format: uri }
        title: { type: [string, "null"] }
        container: { type: [string, "null"] }
        author: { type: [string, "null"] }
        source_updated_at: { type: [string, "null"], format: date-time }
        ingested_at: { type: [string, "null"], format: date-time }
