  # ===========================================================================
  # PHASE 3 — mcp-pgvector (FR-011, FR-013)
  # Kết nối bằng role mcp_query_ro + transaction READ ONLY. Không có tool chạy
  # SQL tuỳ ý (từ chối theo thiết kế — ADR-0008).
  # ===========================================================================
  /mcp/pgvector/tools/kb_semantic_search:
    post:
      operationId: kb_semantic_search
      tags: [pgvector]
      summary: Vector similarity search trên kho embedding, trả chunk kèm nguồn gốc để trích dẫn.
      description: |
        Embed câu hỏi bằng **cùng model** với pipeline (ADR-0010), rồi
        `ORDER BY embedding <=> $query LIMIT top_k` với filter `deleted=false`.
        Mỗi chunk trả `source_type` + `source_uri` gốc (Confluence/GitLab/…) làm citation
        (FR-011 AC-001, BR-005).

        **Ngữ nghĩa `empty` — phân biệt "không có dữ liệu" với "filter đã loại mất":**
        HNSW là ANN index, filter được áp *sau* khi index trả `ef_search` ứng viên, nên một
        filter hẹp (`source_types`, `container`, `updated_after`) có thể cho 0 dòng **dù tồn
        tại chunk rất giống**. Trả `status=empty` trong trường hợp đó là một **false negative
        được trình bày như sự thật** — phá đúng FR-015. Vì vậy:
        * Server chạy `SET LOCAL hnsw.iterative_scan = relaxed_order` và
          `hnsw.ef_search = max(64, 8 × top_k)` trong transaction (pgvector ≥ 0.8), hoặc
          over-fetch `top_k × 4` rồi filter phía ứng dụng.
        * `status=empty` **chỉ** được trả khi similarity tốt nhất **không tính filter** vẫn
          dưới `min_similarity`. `meta.warnings` nêu `best_similarity`.
        * Nếu truy vấn không filter có match nhưng filter làm rỗng kết quả → `status=empty`
          kèm warning `"filters may have excluded matches; thử lại không có source_types/container"`,
          và Claude phải nói rõ là **bộ lọc** loại kết quả, không phải "không có dữ liệu".
        (FR-011 AC-002, FR-013 AC-002)
      x-requirements: [FR-011, FR-013, FR-015]
      x-acceptance-criteria: [FR-011/AC-001, FR-011/AC-002, FR-011/AC-003, FR-013/AC-001, FR-013/AC-002]
      x-phase: 3
      x-mcp-server: mcp-pgvector
      x-readonly: true
      x-side-effects: none
      x-guardrails:
        - "role mcp_query_ro (không có INSERT/UPDATE/DELETE)"
        - "BEGIN READ ONLY"
        - "statement_timeout=15s"
        - "no arbitrary SQL — chỉ câu SQL tham số hoá viết sẵn"
        - "hnsw.iterative_scan=relaxed_order + ef_search>=8*top_k (chống false negative do post-filter)"
        - "WHERE embedding_model = $configured (re-embed đang dở không làm sai không gian vector)"
      x-upstream: "SELECT ... FROM kb.chunks JOIN kb.documents ... ORDER BY embedding <=> $1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 3, maxLength: 4096 }
                top_k: { type: integer, minimum: 1, maximum: 50, default: 8 }
                min_similarity: { type: number, minimum: 0, maximum: 1, default: 0.30 }
                source_types:
                  type: array
                  items: { $ref: '#/components/schemas/SourceType' }
                  uniqueItems: true
                  maxItems: 10
                  default: []
                  description: |
                    Rỗng = mọi nguồn. `maxItems: 10` vì `SourceType` tách `sqs` và `sns` thành
                    hai giá trị (9 nguồn nghiệp vụ, 10 giá trị enum).
                    **Lưu ý false negative:** filter này được áp sau ANN scan — xem phần
                    "Ngữ nghĩa `empty`" ở `description` của tool.
                container: { type: [string, "null"], default: null, description: Lọc theo space key / project path.
                }
                updated_after: { type: [string, "null"], format: date-time, default: null }
                max_chars_per_chunk: { type: integer, minimum: 200, maximum: 8000, default: 2000 }
            example:
              query: "Tại sao payment worker retry nhiều lần rồi vẫn fail?"
              top_k: 8
              min_similarity: 0.3
              source_types: [confluence, gitlab]
      responses:
        '200': { $ref: '#/components/responses/KbChunkMatchList' }
        default: { $ref: '#/components/responses/ToolError' }

