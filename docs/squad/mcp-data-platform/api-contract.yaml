paths:

  # ===========================================================================
  # PHASE 1 — mcp-confluence (FR-001, FR-003)
  # ===========================================================================
  /mcp/confluence/tools/confluence_search_pages:
    post:
      operationId: confluence_search_pages
      tags: [confluence]
      summary: Tìm page/nội dung Confluence theo từ khoá (read-only).
      description: |
        Tìm kiếm full-text trên Confluence (CQL `text ~ "..."`), lọc tuỳ chọn theo space và
        thời điểm cập nhật. Trả về page kèm excerpt và URL dùng làm citation.
        `status=empty` khi không có page nào khớp (FR-001 AC-002).
      x-requirements: [FR-001, FR-003, FR-015]
      x-acceptance-criteria: [FR-001/AC-001, FR-001/AC-002]
      x-phase: 1
      x-mcp-server: mcp-confluence
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /rest/api/content/search (CQL)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Từ khoá tìm kiếm (không phải CQL thô; server tự escape).
                space_key:
                  type: [string, "null"]
                  default: null
                  description: Giới hạn trong một space (ví dụ `PAY`).
                updated_after:
                  type: [string, "null"]
                  format: date-time
                  default: null
                labels:
                  type: array
                  items: { type: string }
                  maxItems: 10
                  default: []
                include_excerpt:
                  type: boolean
                  default: true
                limit: { $ref: '#/components/schemas/LimitField' }
                cursor: { $ref: '#/components/schemas/CursorField' }
            example:
              query: "payment retry policy"
              space_key: "PAY"
              limit: 10
      responses:
        '200':
          description: Kết quả tìm kiếm.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResultBase'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ConfluencePage' }
              examples:
                ok:
                  summary: Có kết quả
                  value:
                    status: ok
                    items:
                      - id: "123456"
                        title: "Payment retry policy"
                        space_key: "PAY"
                        url: "https://wiki.example.com/pages/viewpage.action?pageId=123456"
                        excerpt: "Retry tối đa 3 lần với backoff luỹ thừa..."
                        content: null
                        version: 7
                        updated_at: "2026-09-21T04:10:00Z"
                        author: "an.nguyen"
                        labels: ["payment", "runbook"]
                        citation_ref: 0
                    citations:
                      - source_type: confluence
                        label: "Payment retry policy (PAY)"
                        uri: "https://wiki.example.com/pages/viewpage.action?pageId=123456"
                        locator: { page_id: "123456", version: 7 }
                    meta:
                      source: confluence
                      returned: 1
                      has_more: false
                      next_cursor: null
                      truncated: false
                      elapsed_ms: 412
                      as_of: "2026-10-01T03:00:00Z"
                      query_echo: { query: "payment retry policy", space_key: "PAY" }
                      warnings: []
                empty: { $ref: '#/components/examples/EmptyResult' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/confluence/tools/confluence_get_page:
    post:
      operationId: confluence_get_page
      tags: [confluence]
      summary: Lấy nội dung đầy đủ của một page Confluence (read-only).
      description: |
        Trả về nội dung page đã chuẩn hoá sang markdown/text, cắt theo `max_chars`.
        `status=not_found` khi `page_id` không tồn tại. Nội dung được bọc `untrusted-content`
        và đi qua redaction (ADR-0015).
      x-requirements: [FR-001, FR-003]
      x-acceptance-criteria: [FR-001/AC-001, FR-001/AC-002]
      x-phase: 1
      x-mcp-server: mcp-confluence
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /rest/api/content/{id}?expand=body.storage,space,version,metadata.labels (body.export_view is forbidden, ADR-0007 A1)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [page_id]
              properties:
                page_id:
                  type: string
                  pattern: '^[0-9A-Za-z._-]{1,64}$'
                body_format:
                  type: string
                  enum: [markdown, text]
                  default: markdown
                max_chars:
                  type: integer
                  minimum: 500
                  maximum: 100000
                  default: 20000
            example: { page_id: "123456", body_format: markdown, max_chars: 20000 }
      responses:
        '200':
          description: Nội dung page (`items` có 0 hoặc 1 phần tử).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResultBase'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        maxItems: 1
                        items: { $ref: '#/components/schemas/ConfluencePage' }
              examples:
                ok:
                  summary: Tìm thấy page
                  value:
                    status: ok
                    items:
                      - id: "123456"
                        title: "Payment retry policy"
                        space_key: "PAY"
                        url: "https://wiki.example.com/pages/viewpage.action?pageId=123456"
                        excerpt: null
                        content: "<untrusted-content source=\"confluence\" id=\"123456\">\n# Payment retry policy\n..."
                        version: 7
                        updated_at: "2026-09-21T04:10:00Z"
                        author: "an.nguyen"
                        labels: ["payment"]
                        citation_ref: 0
                    citations:
                      - source_type: confluence
                        label: "Payment retry policy (PAY) v7"
                        uri: "https://wiki.example.com/pages/viewpage.action?pageId=123456"
                        locator: { page_id: "123456", version: 7 }
                    meta:
                      source: confluence
                      returned: 1
                      has_more: false
                      next_cursor: null
                      truncated: true
                      elapsed_ms: 260
                      as_of: "2026-10-01T03:00:00Z"
                      query_echo: { page_id: "123456" }
                      warnings: ["content truncated at 20000 chars"]
                not_found: { $ref: '#/components/examples/NotFoundResult' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/confluence/tools/confluence_list_spaces:
    post:
      operationId: confluence_list_spaces
      tags: [confluence]
      summary: Liệt kê các space Confluence mà credential hiện tại đọc được.
      description: Dùng để Claude biết phạm vi tra cứu trước khi search. `status=empty` nếu không có space nào.
      x-requirements: [FR-001]
      x-acceptance-criteria: [FR-001/AC-001]
      x-phase: 1
      x-mcp-server: mcp-confluence
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /rest/api/space"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query:
                  type: [string, "null"]
                  maxLength: 128
                  default: null
                  description: Lọc theo key/name.
                limit: { $ref: '#/components/schemas/LimitField' }
                cursor: { $ref: '#/components/schemas/CursorField' }
            example: { query: "pay", limit: 25 }
      responses:
        '200':
          description: Danh sách space.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResultBase'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ConfluenceSpace' }
              examples:
                ok:
                  value:
                    status: ok
                    items:
                      - key: "PAY"
                        name: "Payment Platform"
                        type: global
                        url: "https://wiki.example.com/display/PAY"
                        citation_ref: 0
                    citations:
                      - source_type: confluence
                        label: "Space PAY — Payment Platform"
                        uri: "https://wiki.example.com/display/PAY"
                        locator: { space_key: "PAY" }
                    meta:
                      source: confluence
                      returned: 1
                      has_more: false
                      next_cursor: null
                      truncated: false
                      elapsed_ms: 130
                      as_of: "2026-10-01T03:00:00Z"
                      query_echo: { query: "pay" }
                      warnings: []
                empty: { $ref: '#/components/examples/EmptyResult' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/confluence/tools/confluence_list_page_children:
    post:
      operationId: confluence_list_page_children
      tags: [confluence]
      summary: Liệt kê page con của một page (điều hướng cây tài liệu).
      description: Cho phép Claude đi xuống cây tài liệu thay vì chỉ dựa vào search. `status=not_found` nếu page cha không tồn tại.
      x-requirements: [FR-001, FR-003]
      x-acceptance-criteria: [FR-001/AC-001, FR-001/AC-002]
      x-phase: 1
      x-mcp-server: mcp-confluence
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /rest/api/content/{id}/child/page"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [page_id]
              properties:
                page_id: { type: string, pattern: '^[0-9A-Za-z._-]{1,64}$' }
                limit: { $ref: '#/components/schemas/LimitField' }
                cursor: { $ref: '#/components/schemas/CursorField' }
            example: { page_id: "123456", limit: 50 }
      responses:
        '200':
          description: Danh sách page con.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ToolResultBase'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ConfluenceChildPage' }
              examples:
                ok:
                  value:
                    status: ok
                    items:
                      - id: "123999"
                        title: "Retry policy — FAQ"
                        url: "https://wiki.example.com/pages/viewpage.action?pageId=123999"
                        updated_at: "2026-09-25T08:00:00Z"
                        citation_ref: 0
                    citations:
                      - source_type: confluence
                        label: "Retry policy — FAQ"
                        uri: "https://wiki.example.com/pages/viewpage.action?pageId=123999"
                        locator: { page_id: "123999", parent_page_id: "123456" }
                    meta:
                      source: confluence
                      returned: 1
                      has_more: false
                      next_cursor: null
                      truncated: false
                      elapsed_ms: 150
                      as_of: "2026-10-01T03:00:00Z"
                      query_echo: { page_id: "123456" }
                      warnings: []
                empty: { $ref: '#/components/examples/EmptyResult' }
                not_found: { $ref: '#/components/examples/NotFoundResult' }
        default: { $ref: '#/components/responses/ToolError' }

  # ===========================================================================
  # PHASE 1 — mcp-gitlab (FR-002, FR-003)
  # Từ đây trở xuống, response 200 dùng response component tái sử dụng
  # (`#/components/responses/*`) — schema + examples ok/empty/not_found nằm ở đó.
  # ===========================================================================
  /mcp/gitlab/tools/gitlab_search_projects:
    post:
      operationId: gitlab_search_projects
      tags: [gitlab]
      summary: Tìm project GitLab theo tên/đường dẫn (read-only).
      description: Dùng để phân giải tên project do người dùng nói thành `path_with_namespace` chuẩn trước khi gọi các tool khác.
      x-requirements: [FR-002, FR-003]
      x-acceptance-criteria: [FR-002/AC-001, FR-002/AC-002]
      x-phase: 1
      x-mcp-server: mcp-gitlab
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /api/v4/projects?search=&membership=&order_by=last_activity_at"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 1, maxLength: 256 }
                membership_only: { type: boolean, default: false }
                limit: { $ref: '#/components/schemas/LimitField' }
                cursor: { $ref: '#/components/schemas/CursorField' }
            example: { query: "payment-service", limit: 10 }
      responses:
        '200': { $ref: '#/components/responses/GitLabProjectList' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/gitlab/tools/gitlab_search_code:
    post:
      operationId: gitlab_search_code
      tags: [gitlab]
      summary: Tìm code (blobs) trong một project hoặc toàn instance.
      description: |
        Search scope `blobs`. Khi `project` được truyền, dùng project-scoped search (nhanh và
        chính xác hơn). Mỗi hit trả `web_url` tới đúng dòng để làm citation.
      x-requirements: [FR-002, FR-003]
      x-acceptance-criteria: [FR-002/AC-001, FR-002/AC-002]
      x-phase: 1
      x-mcp-server: mcp-gitlab
      x-readonly: true
      x-side-effects: none
      x-upstream: "GET /api/v4/search?scope=blobs | GET /api/v4/projects/{id}/search?scope=blobs"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 512 }
                project: { $ref: '#/components/schemas/GitLabProjectScope' }
                ref: { type: [string, "null"], default: null, description: Branch/tag; mặc định là default branch. }
                filename_filter: { type: [string, "null"], default: null, description: "Ví dụ `*.py`." }
                limit: { $ref: '#/components/schemas/LimitField' }
                cursor: { $ref: '#/components/schemas/CursorField' }
            example: { query: "RetryPolicy", project: "team/payment-service", limit: 20 }
      responses:
        '200': { $ref: '#/components/responses/GitLabCodeHitList' }
        default: { $ref: '#/components/responses/ToolError' }

  /mcp/gitlab/tools/gitlab_get_file:
    post:
      operationId: gitlab_get_file
      tags: [gitlab]
      summary: Đọc nội dung một file trong repo tại một ref.
      description: |
        Nội dung bị cắt theo `max_bytes`, đi qua redaction và deny-glob
        (`MCP_GITLAB_PATH_DENY`, mặc định chặn `*.env`, `*secret*`, `*.pem`, `id_rsa*`).
        Path bị chặn trả `status=not_found` + `meta.warnings` nêu lý do policy (ADR-0015).
        `status=not_found` khi project/path/ref không tồn tại (FR-002 AC-002).
      x-requirements: [FR-002, FR-003]
      x-acceptance-criteria: [FR-002/AC-001, FR-002/AC-002]
      x-phase: 1
      x-mcp-server: mcp-gitlab
