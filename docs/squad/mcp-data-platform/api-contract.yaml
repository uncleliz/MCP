      summary: Metadata chi tiết một topic (partition, replica, config, watermark, số message xấp xỉ).
      description: |
        `approx_message_count` = tổng `(high_watermark - low_watermark)` trên các partition —
        là **xấp xỉ** (không trừ message đã compact/xoá theo retention); được nêu rõ trong
        `meta.warnings`. Citation = topic + partition + watermark (FR-007 AC-001).
        `status=not_found` khi topic không tồn tại (FR-007 AC-002).
      x-requirements: [FR-007, FR-009]
      x-acceptance-criteria: [FR-007/AC-001, FR-007/AC-002]
      x-phase: 2
      x-mcp-server: mcp-kafka
      x-readonly: true
      x-side-effects: none
      x-guardrails:
        - "allow.auto.create.topics=false"
