  /cli/mcp-ingest/run:
    post:
      operationId: ingest_run
      tags: [ingest]
      summary: "CLI: chạy crawl + embed + upsert cho một hoặc tất cả nguồn."
      description: |
        Một run xử lý từng nguồn tuần tự, **cách ly lỗi theo nguồn**: nguồn lỗi được ghi vào
        `error_summary`, không nâng checkpoint, các nguồn còn lại vẫn chạy → run trả
        `status=partial` (FR-012 AC-002). Document có `content_hash` không đổi được skip
        (không embed lại). Document đã đổi được **update/replace** trong một transaction, không
        nhân bản (FR-012 AC-003).
        Chống chạy trùng bằng `pg_try_advisory_lock(hashtext('mcp-ingest:'||source_type))` trên
        một **session riêng, không pooled** — một lock cho mỗi nguồn, không phải một lock cho cả
        run. Mỗi nguồn ghi **một hàng riêng** trong `kb.ingest_runs` (bảng có `source_type NOT NULL`).
        Exit code: `0`=success, `1`=partial, `2`=failed, `3`=lock đang bị giữ.

        **Redaction ở tầng ingest (BẮT BUỘC, ADR-0015):** deny-glob + `redact.scrub()` chạy ở
        stage `redact` **TRƯỚC** khi chunk/embed/`INSERT`. Nếu chỉ redact ở tool layer thì
        `.env`/`.pem` và token bị persist vào `kb.chunks` rồi phát lại qua `kb_semantic_search`,
        vòng qua chính deny-glob mà `gitlab_get_file` thực thi.

        **Quy tắc nâng checkpoint (chống mất dữ liệu âm thầm):**
        `new_cursor = min(watermark của document fail / bỏ qua vì lỗi) − ε`; nếu không document
        nào lỗi thì `= max(watermark của document đã commit thành công)`. Có bất kỳ document
        fail → `IngestSourceResult.status = partial` **kể cả khi** crawl ở mức nguồn thành công.
        Document lỗi lặp lại được ghi vào `kb.ingest_failures` và lấy lại bằng `--retry-failed`
        thay vì bị bỏ im lặng. Biên watermark là **inclusive (`>=`)**; bản ghi trùng được
        `content_hash` hấp thụ.

        **`mode=full` (reconcile + tombstone) có safety valve:** chỉ tombstone khi nguồn đó
        `status=success` **và** `documents_seen >= 0.8 × số document hiện có` của nguồn; ngược
        lại bỏ qua reconcile và ghi `IngestError{stage: reconcile}`. Không có valve này, một lần
        crawl chết giữa đường sẽ tombstone phần còn lại của corpus và `kb_semantic_search` trả
        "không có dữ liệu index" cho mọi thứ. Tombstone chạy đúng một câu, scoped theo nguồn:
        `UPDATE kb.documents SET deleted_at=now() WHERE source_type=$1
         AND last_seen_run_id IS DISTINCT FROM $run AND deleted_at IS NULL`.

        **Hash-skip KHÔNG bỏ qua metadata citation:** `title`, `source_uri`, `container`,
        `author`, `source_updated_at`, `last_seen_*` luôn được `UPDATE` kể cả khi
        `content_hash` không đổi — nếu không, page bị đổi tên/di chuyển giữ citation URL cũ
        (hỏng BR-005 / FR-011 AC-001). Khoá skip là `(content_hash, chunk_config_hash)`, nên
        đổi cấu hình chunker cũng kích hoạt re-chunk.
      x-requirements: [FR-012]
      x-acceptance-criteria: [FR-012/AC-001, FR-012/AC-002, FR-012/AC-003]
      x-phase: 3
      x-interface: cli
      x-cli-command: "mcp-ingest run [--source all|confluence|gitlab|opensearch] [--mode incremental|full] [--since ISO8601] [--limit N] [--retry-failed] [--dry-run] [--json]"
      x-mcp-server: none
      x-readonly: false
      x-writes: kb
      x-side-effects: "INSERT/UPDATE/DELETE trên kb.documents, kb.chunks, kb.ingest_runs, kb.ingest_source_state. Đọc read-only ở các nguồn."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                source:
                  type: string
                  enum: [all, confluence, gitlab, opensearch]
                  default: all
                  description: v1 hỗ trợ 3 connector; thêm connector là thay đổi minor (thêm enum value).
                mode: { type: string, enum: [incremental, full], default: incremental }
                since: { type: [string, "null"], format: date-time, default: null, description: "Bỏ qua checkpoint, crawl từ mốc này." }
                limit: { type: [integer, "null"], minimum: 1, default: null, description: Giới hạn số document mỗi nguồn (dùng khi test). }
                retry_failed: { type: boolean, default: false, description: Xử lý lại các document trong `kb.ingest_failures` trước khi crawl theo checkpoint. }
                dry_run: { type: boolean, default: false, description: Crawl + chunk + hash nhưng KHÔNG embed và KHÔNG ghi DB. }
            example: { source: all, mode: incremental }
      responses:
        '200':
          description: Báo cáo run (in ra stdout khi `--json`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestRunReport' }
              examples:
                partial_one_source_down:
                  summary: Confluence OK, GitLab không tới được (FR-012 AC-002)
                  value:
                    mode: incremental
                    started_at: "2026-10-01T03:00:00Z"
                    finished_at: "2026-10-01T03:07:41Z"
                    status: partial
                    exit_code: 1
                    embedding_model: "BAAI/bge-m3"
                    sources:
                      - source_type: confluence
                        run_id: "9b1d1e10-0000-4000-8000-000000000001"
                        status: success
                        documents_seen: 320
                        documents_upserted: 12
                        documents_skipped: 308
                        documents_failed: 0
                        chunks_written: 74
                        duration_s: 214.5
                        cursor_advanced: true
                        errors: []
                      - source_type: gitlab
                        run_id: "9b1d1e10-0000-4000-8000-000000000002"
                        status: failed
                        documents_seen: 0
                        documents_upserted: 0
                        documents_skipped: 0
                        documents_failed: 0
                        chunks_written: 0
                        duration_s: 25.1
                        cursor_advanced: false
                        errors:
                          - stage: crawl
                            source_id: null
                            code: upstream_timeout
                            message: "connect timeout tới gitlab.example.com sau 3s (kiểm tra VPN)"
                            retryable: true
        default: { $ref: '#/components/responses/ToolError' }

