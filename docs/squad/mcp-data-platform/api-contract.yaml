        citation_ref: { type: integer, minimum: 0 }

    # =======================================================================
    # SCHEMAS — Ingest CLI (FR-012)
    # =======================================================================
    IngestError:
      type: object
      additionalProperties: false
      required: [stage, code, message, retryable]
      properties:
        stage: { type: string, enum: [config, connect, crawl, normalize, redact, chunk, embed, persist, reconcile, prune] }
        source_id: { type: [string, "null"], description: "`null` khi lỗi ở mức nguồn, không phải một document." }
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, maxLength: 1024 }
        retryable: { type: boolean }
    IngestSourceResult:
      type: object
      additionalProperties: false
      required: [source_type, status, documents_seen, documents_upserted, documents_skipped, documents_failed, chunks_written, cursor_advanced, errors]
      properties:
        source_type: { $ref: '#/components/schemas/SourceType' }
        run_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [success, partial, failed, skipped] }
        documents_seen: { type: integer, minimum: 0 }
        documents_upserted: { type: integer, minimum: 0, description: Mới hoặc đã đổi (FR-012 AC-001/AC-003). }
        documents_skipped: { type: integer, minimum: 0, description: "`content_hash` không đổi → không embed lại." }
        documents_failed: { type: integer, minimum: 0 }
        documents_tombstoned: { type: [integer, "null"], minimum: 0, description: Chỉ có ở `mode=full`. }
        chunks_written: { type: integer, minimum: 0 }
        duration_s: { type: [number, "null"], minimum: 0 }
        cursor_advanced:
          type: boolean
          description: |
            `false` khi nguồn lỗi — checkpoint KHÔNG được nâng để lần sau retry đúng chỗ
            (FR-012 AC-002).
        errors:
          type: array
          items: { $ref: '#/components/schemas/IngestError' }
    IngestRunReport:
      type: object
      additionalProperties: false
      required: [mode, started_at, status, exit_code, sources]
      properties:
        mode: { type: string, enum: [incremental, full, reembed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        status:
          type: string
          enum: [success, partial, failed]
          description: "`partial` khi có ít nhất một nguồn lỗi nhưng nguồn khác thành công (FR-012 AC-002)."
        exit_code: { type: integer, enum: [0, 1, 2, 3], description: "0=success, 1=partial, 2=failed, 3=lock đang bị giữ." }
        embedding_model: { type: [string, "null"] }
        dry_run: { type: boolean, default: false }
        sources:
          type: array
          items: { $ref: '#/components/schemas/IngestSourceResult' }
    IngestStatusRow:
      type: object
      additionalProperties: false
      required: [source_type, document_count, chunk_count]
      properties:
        source_type: { $ref: '#/components/schemas/SourceType' }
        last_success_at: { type: [string, "null"], format: date-time }
        staleness_hours: { type: [number, "null"], minimum: 0 }
        document_count: { type: integer, minimum: 0 }
        chunk_count: { type: integer, minimum: 0 }
        last_run_status: { type: [string, "null"], enum: [running, success, partial, failed, null] }
        last_run_at: { type: [string, "null"], format: date-time }
    IngestSourceConfigRow:
      type: object
      additionalProperties: false
      required: [source_type, connector, enabled, configured, missing_env]
      properties:
        source_type: { $ref: '#/components/schemas/SourceType' }
        connector: { type: string }
