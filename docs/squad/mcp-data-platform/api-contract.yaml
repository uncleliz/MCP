  /mcp/kafka/tools/kafka_peek_messages:
    post:
      operationId: kafka_peek_messages
      tags: [kafka]
      summary: Đọc mẫu message từ topic mà KHÔNG commit offset và KHÔNG tham gia consumer group.
      description: |
        Đọc tối đa `limit` message từ vị trí chỉ định. Bảo đảm read-only (FR-007 AC-003):
        `assign()` thủ công (không `subscribe()`), `enable.auto.commit=false`,
        `group.id` dùng-một-lần, không gọi `commit()`. Không có tool produce ở bất kỳ đâu.
        `value` đi qua redaction (ADR-0015); vượt `max_bytes` → `status=partial`.
      x-requirements: [FR-007, FR-009]
      x-acceptance-criteria: [FR-007/AC-001, FR-007/AC-002, FR-007/AC-003, FR-014/AC-001]
      x-phase: 2
      x-mcp-server: mcp-kafka
      x-readonly: true
      x-side-effects: none
      x-guardrails:
        - "no Producer anywhere in the package"
        - "assign() not subscribe()"
        - "no commit() on any code path"
        - "throwaway group.id"
        - "allow.auto.create.topics=false (topic không tồn tại KHÔNG được tạo ra)"
      x-upstream: "Consumer.assign + seek + poll (không commit)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topic]
              properties:
                topic: { type: string, minLength: 1, maxLength: 249 }
                partition: { type: [integer, "null"], minimum: 0, default: null, description: null = lấy đều từ mọi partition. }
                from:
                  type: string
                  enum: [latest, earliest, offset, timestamp]
                  default: latest
                  description: "`latest` = n message cuối; `offset`/`timestamp` cần field tương ứng."
                offset: { type: [string, "null"], pattern: '^[0-9]{1,19}$', default: null, description: Offset dạng string (có thể vượt 2^53). }
                timestamp: { type: [string, "null"], format: date-time, default: null }
                limit: { type: integer, minimum: 1, maximum: 100, default: 10 }
                value_format: { type: string, enum: [auto, json, utf8, base64], default: auto }
                max_bytes: { $ref: '#/components/schemas/MaxBytesField' }
                timeout_s: { $ref: '#/components/schemas/TimeoutField' }
            example: { topic: "payment.events", from: latest, limit: 5, value_format: auto }
      responses:
        '200': { $ref: '#/components/responses/KafkaMessageList' }
        default: { $ref: '#/components/responses/ToolError' }

